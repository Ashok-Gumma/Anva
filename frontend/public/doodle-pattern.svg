<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Minimal WhatsApp-Style Doodle Pattern for Anva -->
  
  <!-- 1. Speech Bubble (Chat) -->
  <g transform="translate(30, 30)">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    <circle cx="9" cy="10" r="1" fill="currentColor"/>
    <circle cx="13" cy="10" r="1" fill="currentColor"/>
    <circle cx="17" cy="10" r="1" fill="currentColor"/>
  </g>

  <!-- 2. Video Camera (Call) -->
  <g transform="translate(130, 25)">
    <path d="M23 7l-7 5 7 5V7z"/>
    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
  </g>

  <!-- 3. Globe / Language Exchange -->
  <g transform="translate(220, 30)">
    <circle cx="12" cy="12" r="10"/>
    <line x1="2" y1="12" x2="22" y2="12"/>
    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
  </g>

  <!-- 4. Phone Receiver -->
  <g transform="translate(305, 30)">
    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
  </g>

  <!-- 5. Code Brackets (Compiler) -->
  <g transform="translate(35, 115)">
    <polyline points="16 18 22 12 16 6"/>
    <polyline points="8 6 2 12 8 18"/>
  </g>

  <!-- 6. Smile Emoji -->
  <g transform="translate(120, 110)">
    <circle cx="12" cy="12" r="10"/>
    <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
    <line x1="9" y1="9" x2="9.01" y2="9"/>
    <line x1="15" y1="9" x2="15.01" y2="9"/>
  </g>

  <!-- 7. Heart -->
  <g transform="translate(215, 110)">
    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.72-8.72 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
  </g>

  <!-- 8. Music Note -->
  <g transform="translate(300, 115)">
    <path d="M9 18V5l12-2v13"/>
    <circle cx="6" cy="18" r="3"/>
    <circle cx="18" cy="16" r="3"/>
  </g>

  <!-- 9. Sparkle Star -->
  <g transform="translate(30, 195)">
    <path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M4.93 19.07l14.14-14.14"/>
  </g>

  <!-- 10. Paper Airplane (Send) -->
  <g transform="translate(125, 190)">
    <line x1="22" y1="2" x2="11" y2="13"/>
    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
  </g>

  <!-- 11. Flashcard / Open Book -->
  <g transform="translate(210, 190)">
    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
  </g>

  <!-- 12. Lightning / Zap -->
  <g transform="translate(305, 195)">
    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
  </g>

  <!-- 13. Headphones -->
  <g transform="translate(35, 275)">
    <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
    <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
  </g>

  <!-- 14. Lock (Security) -->
  <g transform="translate(125, 275)">
    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
  </g>

  <!-- 15. Microphone -->
  <g transform="translate(215, 275)">
    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
    <line x1="12" y1="19" x2="12" y2="23"/>
    <line x1="8" y1="23" x2="16" y2="23"/>
  </g>

  <!-- 16. Coffee Mug -->
  <g transform="translate(300, 275)">
    <path d="M18 8h1a4 4 0 0 1 0 8h-1"/>
    <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
    <line x1="6" y1="1" x2="6" y2="4"/>
    <line x1="10" y1="1" x2="10" y2="4"/>
  </g>

  <!-- Subtle Accent Fillers -->
  <circle cx="85" cy="65" r="3.5" fill="currentColor"/>
  <circle cx="270" cy="75" r="3" fill="currentColor"/>
  <circle cx="175" cy="155" r="3.5" fill="currentColor"/>
  <circle cx="75" cy="245" r="3" fill="currentColor"/>
  <circle cx="265" cy="240" r="3.5" fill="currentColor"/>
  
  <polygon points="175 60 178 68 186 71 178 74 175 82 172 74 164 71 172 68"/>
  <polygon points="70 150 72 155 77 157 72 159 70 164 68 159 63 157 68 155"/>
</svg>
